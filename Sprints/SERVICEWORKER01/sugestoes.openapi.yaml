
openapi: 3.0.3
info:
  title: API de Sugestões de Alunos
  description: API REST para submissão, acompanhamento e consulta de sugestões na ESTGV, com autenticação JWT enviada no cabeçalho Authorization (esquema HTTP Bearer) ou num cookie de sessão, e controlo de autorização por papel.
  version: 2.1.0
  license:
    name: MIT

servers:
  - url: https://api.estgv.exemplo/v2
    description: Servidor de produção
  - url: http://localhost:3000/v2
    description: Servidor de desenvolvimento local

security:
  - tokenJWT: []
  - cookieSessao: []

paths:
  /sugestoes:
    get:
      operationId: listarSugestoes
      summary: Listar sugestões
      description: Lista as sugestões existentes. Papel admitido aluno e servicos. Um aluno acede apenas às suas próprias sugestões; os serviços acedem a todas as sugestões.
      responses:
        '200':
          description: Lista paginada de sugestões
          headers:
            Cache-Control:
              description: Resposta associada à identidade do utilizador
              schema:
                type: string
                example: private, no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSugestoes'
        '401':
          description: Pedido não autenticado
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum:
                  - 'Bearer'
                  - 'Bearer error="invalid_token"'
                example: 'Bearer'
            Cache-Control:
              schema:
                type: string
                enum:
                  - 'no-store'
                example: 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: Autenticação necessária. Token ausente ou inválido.
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    post:
      operationId: criarSugestao
      summary: Criar uma nova sugestão
      description: Submete uma nova sugestão. Papel admitido aluno. O número de aluno associado à sugestão é determinado pelo servidor a partir do token de autenticação e não pelo corpo do pedido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '201':
          description: Sugestão criada com sucesso
          headers:
            Location:
              description: URL da nova sugestão criada
              schema:
                type: string
                example: /v2/sugestoes/1
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          description: Dados da sugestão inválidos
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /sugestoes/{id}:
    get:
      operationId: obterSugestao
      summary: Obter detalhe de uma sugestão
      description: Obtém uma sugestão pelo seu identificador. Papel admitido aluno e servicos. Um aluno acede apenas às suas próprias sugestões; perante uma sugestão pertencente a outro aluno o servidor responde 404 para não revelar a existência do recurso. Os serviços acedem a qualquer sugestão.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único da sugestão
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Detalhes da sugestão
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
              example:
                id: 1
                numeroAluno: '12345'
                titulo: Instalação de tomadas na sala de estudo
                descricao: É necessária a colocação de mais tomadas elétricas nas mesas centrais da sala de estudo.
                categoria: infraestruturas
                estado: submetida
                dataCriacao: '2026-10-26T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Sugestão não encontrada ou pertencente a outro aluno (o aluno que pede uma sugestão de que não é autor recebe 404).
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    put:
      operationId: substituirSugestao
      summary: Substituir uma sugestão existente
      description: Substitui integralmente o conteúdo de uma sugestão. Papel admitido aluno, apenas para as suas próprias sugestões.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador da sugestão a substituir
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '200':
          description: Sugestão atualizada com sucesso
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          description: Dados fornecidos inválidos
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          description: Sugestão não encontrada ou pertencente a outro aluno (o aluno que tenta substituir uma sugestão de que não é autor recebe 404).
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    delete:
      operationId: retirarSugestao
      summary: Retirar uma sugestão
      description: Remove uma sugestão do sistema. Papel admitido aluno, apenas para as suas próprias sugestões.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador da sugestão a retirar
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '204':
          description: Sugestão retirada com sucesso
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          description: Sugestão não encontrada ou pertencente a outro aluno (o aluno que tenta retirar uma sugestão de que não é autor recebe 404).
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /sugestoes/{id}/acompanhamentos:
    get:
      operationId: listarAcompanhamentos
      summary: Listar acompanhamentos de uma sugestão
      description: Lista o histórico de acompanhamentos associados a uma sugestão. Papel admitido aluno e servicos. Um aluno acede apenas aos acompanhamentos das suas próprias sugestões; perante sugestão de outro aluno responde 404. Os serviços acedem aos acompanhamentos de todas as sugestões.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador da sugestão
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Lista de acompanhamentos da sugestão
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-cache
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Acompanhamento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Sugestão não encontrada ou pertencente a outro aluno (o aluno que tenta aceder aos acompanhamentos de sugestão alheia recebe 404).
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    post:
      operationId: registarAcompanhamento
      summary: Registar acompanhamento numa sugestão
      description: Regista uma nota de acompanhamento e atualiza o estado de uma sugestão. Papel admitido servicos. O responsável pelo acompanhamento é determinado pelo servidor a partir do token de autenticação.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador da sugestão
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcompanhamentoNovo'
      responses:
        '201':
          description: Acompanhamento registado com sucesso
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acompanhamento'
        '400':
          description: Dados do acompanhamento inválidos
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          description: Sugestão não encontrada.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /estatisticas/resolucao:
    get:
      operationId: obterEstatisticasResolucao
      summary: Obter estatísticas de resolução
      description: Devolve o total de sugestões e a respetiva contagem por estado de resolução. Operação pública.
      security: []
      responses:
        '200':
          description: Estatísticas de resolução
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasResolucao'
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /estatisticas/categorias:
    get:
      operationId: obterEstatisticasCategorias
      summary: Obter estatísticas por categoria
      description: Devolve a contagem global de sugestões agrupadas por categoria. Operação pública.
      security: []
      responses:
        '200':
          description: Estatísticas por categoria
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasCategorias'
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /categorias:
    get:
      operationId: listarCategorias
      summary: Listar categorias disponíveis
      description: Devolve o catálogo de categorias válidas para classificação de sugestões. Operação pública.
      security: []
      responses:
        '200':
          description: Lista de categorias
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=86400
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /tokens:
    post:
      operationId: criarToken
      summary: Autenticar utilizador e emitir token JWT
      description: Emite um token de autenticação JWT assinado com HS256 mediante verificação válida de utilizador e palavra-passe. Operação pública.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
      responses:
        '200':
          description: Token emitido com sucesso
          headers:
            Cache-Control:
              description: Proibido armazenar credenciais ou tokens em qualquer cache
              schema:
                type: string
                enum:
                  - 'no-store'
                example: 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NSIsIm5vbWUiOiJBbmEgU2lsdmEiLCJwYXBlbCI6ImFsdW5vIiwiaWF0IjoxNzkxNTU0NDAwLCJleHAiOjE3OTE1NTUzMDB9.d41d8cd98f00b204e9800998ecf8427e1b5e3f2a1b5e3f2a1b5e3f2a1b5e3f2a
                tipo: Bearer
                expiraEm: 900
        '400':
          description: Corpo do pedido não conforme com o esquema Credenciais
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - 'no-store'
                example: 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/CredenciaisInvalidas'
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - 'no-store'
                example: 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /sessao:
    post:
      operationId: criarSessao
      summary: Iniciar sessão
      description: Verifica as credenciais e, em caso de sucesso, emite um token JWT que é entregue ao browser no cookie sessao (HttpOnly). O token não é devolvido no corpo da resposta. Em caso de erro não é enviado o cabeçalho Set-Cookie. Operação pública.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
      responses:
        '200':
          description: Sessão iniciada com sucesso
          headers:
            Set-Cookie:
              description: Cookie de sessão com o token JWT
              schema:
                type: string
                example: 'sessao=eyJhbGciOi...; Max-Age=900; Path=/v2; Expires=Sun, 01 Nov 2026 21:30:00 GMT; HttpOnly; SameSite=Strict'
            Cache-Control:
              description: Proibido armazenar credenciais ou tokens em qualquer cache
              schema:
                type: string
                enum:
                  - 'no-store'
                example: 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '400':
          description: Corpo do pedido não conforme com o esquema Credenciais
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - 'no-store'
                example: 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/CredenciaisInvalidas'
        default:
          description: Erro inesperado
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - 'no-store'
                example: 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    get:
      operationId: obterSessao
      summary: Obter a sessão atual
      description: Devolve os dados do utilizador autenticado. Permite ao cliente saber se existe sessão e quem é o utilizador sem ter de ler o token. Papel admitido aluno e servicos.
      responses:
        '200':
          description: Dados da sessão atual
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - 'no-store'
                example: 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

    delete:
      operationId: terminarSessao
      summary: Terminar sessão
      description: Pede ao browser que apague o cookie sessao. O token não é invalidado no servidor e continua válido até expirar. Operação pública.
      security: []
      responses:
        '204':
          description: Sessão terminada; o cookie é apagado no browser
          headers:
            Set-Cookie:
              description: Cookie sessao vazio e com data de validade no passado, o que leva o browser a apagá-lo
              schema:
                type: string
                example: 'sessao=; Path=/v2; Expires=Thu, 01 Jan 1970 00:00:00 GMT'
            Cache-Control:
              schema:
                type: string
                enum:
                  - 'no-store'
                example: 'no-store'

components:
  securitySchemes:
    tokenJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token obtido em POST /tokens.

        | Claim | Tipo | Significado |
        | :--- | :--- | :--- |
        | sub | string | Identificador único da entidade titular (número de aluno ou nome.apelido) |
        | nome | string | Nome completo do utilizador |
        | papel | string | Papel atribuído (aluno ou servicos) |
        | iat | integer | Instante de emissão (em segundos desde 1970-01-01T00:00:00Z) |
        | exp | integer | Instante de expiração (em segundos desde 1970-01-01T00:00:00Z) |

    cookieSessao:
      type: apiKey
      in: cookie
      name: sessao
      description: |
        Token JWT (com as mesmas claims do esquema tokenJWT) guardado pelo browser no cookie sessao.
        O cookie é criado em POST /sessao e enviado automaticamente pelo browser em cada pedido.

        | Atributo | Valor | Significado |
        | :--- | :--- | :--- |
        | Max-Age | 900 | O cookie é válido durante 900 segundos (15 minutos) |
        | Path | /v2 | Só é enviado para endereços começados por /v2 |
        | HttpOnly | — | O JavaScript da página não consegue ler o cookie |
        | SameSite | Strict | Só é enviado em pedidos feitos a partir do próprio site |

  responses:
    NaoAutenticado:
      description: Pedido não autenticado (token ausente, inválido ou expirado)
      headers:
        WWW-Authenticate:
          description: Esquema de autenticação exigido e eventual diagnóstico de erro
          schema:
            type: string
            enum:
              - 'Bearer'
              - 'Bearer error="invalid_token"'
          example: 'Bearer'
        Cache-Control:
          description: Impede o armazenamento da resposta em cache
          schema:
            type: string
            enum:
              - 'no-store'
          example: 'no-store'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    CredenciaisInvalidas:
      description: Credenciais incorretas (utilizador inexistente ou palavra-passe errada)
      headers:
        Cache-Control:
          description: Impede o armazenamento da resposta em cache
          schema:
            type: string
            enum:
              - 'no-store'
          example: 'no-store'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    Proibido:
      description: Pedido autenticado, mas a identidade não tem permissão para a operação
      headers:
        Cache-Control:
          description: Impede o armazenamento da resposta em cache
          schema:
            type: string
            enum:
              - 'no-store'
          example: 'no-store'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  schemas:
    SugestaoNova:
      type: object
      properties:
        titulo:
          type: string
          minLength: 3
          maxLength: 100
          example: Instalação de tomadas na sala de estudo
        descricao:
          type: string
          minLength: 10
          maxLength: 1000
          example: É necessária a colocação de mais tomadas elétricas nas mesas centrais da sala de estudo.
        categoria:
          type: string
          enum:
            - infraestruturas
            - pedagogia
            - cantina
            - convivio
            - outros
          example: infraestruturas
      required:
        - titulo
        - descricao
        - categoria

    Sugestao:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        numeroAluno:
          type: string
          pattern: '^[0-9]{5,8}$'
          readOnly: true
          example: '12345'
        titulo:
          type: string
          minLength: 3
          maxLength: 100
          example: Instalação de tomadas na sala de estudo
        descricao:
          type: string
          minLength: 10
          maxLength: 1000
          example: É necessária a colocação de mais tomadas elétricas nas mesas centrais da sala de estudo.
        categoria:
          type: string
          enum:
            - infraestruturas
            - pedagogia
            - cantina
            - convivio
            - outros
          example: infraestruturas
        estado:
          type: string
          enum:
            - submetida
            - em_analise
            - aceite
            - rejeitada
          readOnly: true
          example: submetida
        dataCriacao:
          type: string
          format: date-time
          readOnly: true
          example: '2026-10-26T10:00:00.000Z'
      required:
        - id
        - numeroAluno
        - titulo
        - descricao
        - categoria
        - estado
        - dataCriacao

    ListaSugestoes:
      type: object
      properties:
        pagina:
          type: integer
          minimum: 1
          example: 1
        tamanhoPagina:
          type: integer
          minimum: 1
          example: 20
        total:
          type: integer
          minimum: 0
          example: 2
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Sugestao'
      required:
        - pagina
        - tamanhoPagina
        - total
        - itens

    AcompanhamentoNovo:
      type: object
      properties:
        texto:
          type: string
          minLength: 5
          maxLength: 500
          example: Sugestão encaminhada para os serviços técnicos.
        novoEstado:
          type: string
          enum:
            - submetida
            - em_analise
            - aceite
            - rejeitada
          example: em_analise
      required:
        - texto
        - novoEstado

    Acompanhamento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        responsavel:
          type: string
          readOnly: true
          example: Rita Sousa
        texto:
          type: string
          minLength: 5
          maxLength: 500
          example: Sugestão encaminhada para os serviços técnicos.
        novoEstado:
          type: string
          enum:
            - submetida
            - em_analise
            - aceite
            - rejeitada
          example: em_analise
        data:
          type: string
          format: date-time
          readOnly: true
          example: '2026-10-26T11:00:00.000Z'
      required:
        - id
        - responsavel
        - texto
        - novoEstado
        - data

    Credenciais:
      type: object
      properties:
        utilizador:
          type: string
          pattern: '^([0-9]{5,8}|[a-z]+\.[a-z]+)$'
          example: '12345'
        palavraPasse:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: ana12345
      required:
        - utilizador
        - palavraPasse

    Token:
      type: object
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NSIsIm5vbWUiOiJBbmEgU2lsdmEiLCJwYXBlbCI6ImFsdW5vIiwiaWF0IjoxNzkxNTU0NDAwLCJleHAiOjE3OTE1NTUzMDB9.d41d8cd98f00b204e9800998ecf8427e1b5e3f2a1b5e3f2a1b5e3f2a1b5e3f2a
        tipo:
          type: string
          enum:
            - Bearer
          example: Bearer
        expiraEm:
          type: integer
          minimum: 1
          example: 900
      required:
        - token
        - tipo
        - expiraEm

    Sessao:
      type: object
      properties:
        utilizador:
          type: string
          pattern: '^([0-9]{5,8}|[a-z]+\.[a-z]+)$'
          example: '12345'
        nome:
          type: string
          example: Ana Silva
        papel:
          type: string
          enum:
            - aluno
            - servicos
          example: aluno
        expiracao:
          type: string
          format: date-time
          example: '2026-11-01T21:30:00.000Z'
      required:
        - utilizador
        - nome
        - papel
        - expiracao

    Categoria:
      type: object
      properties:
        id:
          type: string
          example: infraestruturas
        nome:
          type: string
          example: Infraestruturas e Equipamentos
      required:
        - id
        - nome

    EstatisticasResolucao:
      type: object
      properties:
        total:
          type: integer
          example: 50
        submetidas:
          type: integer
          example: 20
        emAnalise:
          type: integer
          example: 15
        aceites:
          type: integer
          example: 10
        rejeitadas:
          type: integer
          example: 5
      required:
        - total
        - submetidas
        - emAnalise
        - aceites
        - rejeitadas

    EstatisticasCategorias:
      type: object
      properties:
