
openapi: 3.0.3

info:
  title: API de Sugestões dos Alunos
  version: 1.0.0
  description: API para submeter, acompanhar e consultar sugestões dos alunos.

servers:
  - url: https://api.estgv.exemplo/v1

paths:
  /sugestoes:
    get:
      operationId: listarSugestoes
      summary: Listar sugestões, com filtros e paginação
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtrar sugestões pelo estado.
          schema:
            $ref: '#/components/schemas/Estado'
        - name: categoria
          in: query
          required: false
          description: Filtrar sugestões pela categoria.
          schema:
            $ref: '#/components/schemas/CodigoCategoria'
        - name: pagina
          in: query
          required: false
          description: Número da página.
          schema:
            type: integer
            minimum: 1
        - name: tamanhoPagina
          in: query
          required: false
          description: Número de sugestões por página.
          schema:
            type: integer
            minimum: 1
            maximum: 50
      
     
      responses:
        '200':
          description: Lista de sugestões obtida com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSugestoes'
        '400':
          $ref: '#/components/responses/Erro400'
        default:
          $ref: '#/components/responses/ErroDefault'


    post:
      operationId: criarSugestao
      summary: Submeter uma sugestão
      requestBody:
        required: true
        description: Dados da sugestão a submeter.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      
      responses:
        '201':
          description: Sugestão criada com sucesso.
          headers:
            Location:
              description: URL da sugestão criada.
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/Erro400'
        default:
          $ref: '#/components/responses/ErroDefault'


  /sugestoes/{id}:
    get:
      operationId: obterSugestao
      summary: Obter uma sugestão
      parameters:
        - $ref: '#/components/parameters/id'
        - name: If-None-Match
          in: header
          required: false
          description: ETag da versão que o cliente já possui.
          schema:
            type: string
      
      responses:
        '200':
          description: Sugestão obtida com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivado'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
              example:
                titulo: Melhorar a biblioteca
                descricao: A biblioteca precisa de mais lugares para estudar.
                categoria: instalacoes
                numeroAluno: '123456'
                id: 1
                estado: aceite
                dataCriacao: '2026-10-01T10:00:00Z'
                dataAtualizacao: '2026-10-05T14:30:00Z'
                dataResolucao: null

        '304':
          description: A sugestão não foi modificada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivado'
            ETag:
              $ref: '#/components/headers/ETag'

        '404':
          $ref: '#/components/responses/Erro404'

        default:
          $ref: '#/components/responses/ErroDefault'

    
    put:
      operationId: substituirSugestao
      summary: Editar uma sugestão ainda submetida
      parameters:
        - $ref: '#/components/parameters/id'
        - name: If-Match
          in: header
          required: true
          description: ETag da versão da sugestão que o cliente pretende editar.
          schema:
            type: string
      requestBody:
        required: true
        description: Novos dados da sugestão.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      
      responses:
        '204':
          description: Sugestão retirada com sucesso, sem corpo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheSemArmazenamento'

        '404':
          $ref: '#/components/responses/Erro404'

        '409':
          $ref: '#/components/responses/Erro409Retirada'

        default:
          $ref: '#/components/responses/ErroDefault'



  /sugestoes/{id}/acompanhamentos:
    get:
      operationId: listarAcompanhamentos
      summary: Histórico de acompanhamento, do mais antigo para o mais recente~
      parameters:
        - $ref: '#/components/parameters/id'
      
      responses:
        '200':
          description: Histórico de acompanhamentos obtido com sucesso, do mais antigo para o mais recente.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivado'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Acompanhamento'

        '404':
          $ref: '#/components/responses/Erro404'

        default:
          $ref: '#/components/responses/ErroDefault'

    post:
      operationId: registarAcompanhamento
      summary: Registar uma mudança de estado
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        description: Dados do novo acompanhamento.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcompanhamentoNovo'
      
      responses:
        '201':
          description: Acompanhamento registado com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheSemArmazenamento'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acompanhamento'

        '400':
          $ref: '#/components/responses/Erro400'

        '404':
          $ref: '#/components/responses/Erro404'

        '409':
          $ref: '#/components/responses/Erro409Transicao'

        default:
          $ref: '#/components/responses/ErroDefault'

  /estatisticas/resolucao:
    get:
      operationId: obterEstatisticasResolucao
      summary: Totais por estado, taxa e tempo médio de resolução
      parameters:
        - name: anoLetivo
          in: query
          required: true
          description: Ano letivo no formato AAAA-AAAA.
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{4}$'
      
      responses:
        '200':
          description: Estatísticas de resolução obtidas com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheEstatisticas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasResolucao'
              example:
                anoLetivo: '2026-2027'
                totalSugestoes: 100
                porEstado:
                  submetida: 20
                  em_analise: 25
                  aceite: 15
                  rejeitada: 10
                  resolvida: 30
                taxaResolucao: 0.3
                tempoMedioResolucaoDias: 12.5

        '400':
          $ref: '#/components/responses/Erro400'

        default:
          $ref: '#/components/responses/ErroDefault'

  /estatisticas/categorias:
    get:
      operationId: obterEstatisticasCategorias
      summary: Os mesmos indicadores, por categoria
      parameters:
        - name: anoLetivo
          in: query
          required: true
          description: Ano letivo no formato AAAA-AAAA.
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{4}$'
      
      responses:
        '200':
          description: Estatísticas por categoria obtidas com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheEstatisticas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasCategorias'

        '400':
          $ref: '#/components/responses/Erro400'

        default:
          $ref: '#/components/responses/ErroDefault'

  /categorias:
    get:
      operationId: listarCategorias
      summary: Listar as categorias e a sua descrição
      parameters:
        - $ref: '#/components/parameters/id'
      
      responses:
        '200':
          description: Lista de categorias obtida com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheCategorias'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'

        default:
          $ref: '#/components/responses/ErroDefault'


components:
  schemas:
    Estado:
      type: string
      enum:
        - submetida
        - em_analise
        - aceite
        - rejeitada
        - resolvida

    CodigoCategoria:
      type: string
      enum:
        - instalacoes
        - ensino
        - servicos
        - atividades
        - outra

    Categoria:
      type: object
      required:
        - codigo
        - descricao
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoCategoria'
        descricao:
          type: string
          minLength: 3
          maxLength: 80

    SugestaoNova:
      type: object
      required:
        - titulo
        - descricao
        - categoria
        - numeroAluno
      properties:
        titulo:
          type: string
          minLength: 10
          maxLength: 120
        descricao:
          type: string
          minLength: 20
          maxLength: 2000
        categoria:
          $ref: '#/components/schemas/CodigoCategoria'
        numeroAluno:
          type: string
          pattern: '^[0-9]{5,8}$'

    Sugestao:
      allOf:
        - $ref: '#/components/schemas/SugestaoNova'
        - type: object
          required:
            - id
            - estado
            - dataCriacao
            - dataAtualizacao
            - dataResolucao
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            estado:
              allOf:
                - $ref: '#/components/schemas/Estado'
              readOnly: true
            dataCriacao:
              type: string
              format: date-time
              readOnly: true
            dataAtualizacao:
              type: string
              format: date-time
              readOnly: true
            dataResolucao:
              type: string
              format: date-time
              nullable: true
              readOnly: true

    AcompanhamentoNovo:
      type: object
      required:
        - novoEstado
        - nota
        - responsavel
      properties:
        novoEstado:
          $ref: '#/components/schemas/Estado'
        nota:
          type: string
          minLength: 5
          maxLength: 500
        responsavel:
          type: string
          minLength: 5
          maxLength: 60
          pattern: '^[A-Z][a-z]+ [A-Z][a-z]+$'

    Acompanhamento:
      allOf:
        - $ref: '#/components/schemas/AcompanhamentoNovo'
        - type: object
          required:
            - id
            - estadoAnterior
            - data
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            estadoAnterior:
              allOf:
                - $ref: '#/components/schemas/Estado'
              readOnly: true
            data:
              type: string
              format: date-time
              readOnly: true

    ListaSugestoes:
      type: object
      required:
        - pagina
        - tamanhoPagina
        - total
        - itens
      properties:
        pagina:
          type: integer
          minimum: 1
        tamanhoPagina:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        itens:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Sugestao'

    EstatisticasResolucao:
      type: object
      required:
        - anoLetivo
        - totalSugestoes
        - porEstado
        - taxaResolucao
        - tempoMedioResolucaoDias
      properties:
        anoLetivo:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
        totalSugestoes:
          type: integer
          minimum: 0
        porEstado:
          type: object
          required:
            - submetida
            - em_analise
            - aceite
            - rejeitada
            - resolvida
          properties:
            submetida:
              type: integer
              minimum: 0
            em_analise:
              type: integer
              minimum: 0
            aceite:
              type: integer
              minimum: 0
            rejeitada:
              type: integer
              minimum: 0
            resolvida:
              type: integer
              minimum: 0
        taxaResolucao:
          type: number
          minimum: 0
          maximum: 1
        tempoMedioResolucaoDias:
          type: number
          minimum: 0
          nullable: true

    EstatisticasCategorias:
      type: object
      required:
        - anoLetivo
        - categorias
      properties:
        anoLetivo:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
        categorias:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required:
              - categoria
              - total
              - resolvidas
              - taxaResolucao
            properties:
              categoria:
                $ref: '#/components/schemas/CodigoCategoria'
              total:
                type: integer
                minimum: 0
              resolvidas:
                type: integer
                minimum: 0
              taxaResolucao:
                type: number
                minimum: 0
                maximum: 1

    Erro:
      type: object
      required:
        - codigo
        - mensagem
      properties:
        codigo:
          type: integer
          minimum: 400
          maximum: 599
        mensagem:
          type: string
          minLength: 1
          maxLength: 200
        detalhes:
          type: array
          items:
            type: object
            required:
              - campo
              - problema
            properties:
              campo:
                type: string
              problema:
                type: string

      headers:
        CachePrivado:
          description: Política de cache privada com revalidação.
          schema:
            type: string
            enum:
              - 'private, no-cache'

        ETag:
          description: Identificador da versão atual do recurso.
          schema:
            type: string

        CacheSemArmazenamento:
          description: Impede o armazenamento da resposta em cache.
          schema:
            type: string
            enum:
              - 'no-store'

        
        CacheEstatisticas:
          description: Permite armazenar as estatísticas em cache durante uma hora.
          schema:
            type: string
            enum:
              - 'public, max-age=3600'

        
        CacheCategorias:
          description: Permite armazenar as categorias em cache durante 24 horas.
          schema:
            type: string
            enum:
              - 'public, max-age=86400'


    parameters:
      id:
        name: id
        in: path
        required: true
        description: Identificador positivo da sugestão.
        schema:
          type: integer
          minimum: 1


